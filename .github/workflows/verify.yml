name: Repository verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Check transformations and validation rules
        run: python -m unittest discover -s tests -v
      - name: Check cautious reference acquisition
        run: node tests/test_csv_collector.cjs
      - name: Verify archived sources and release integrity
        run: python scripts/verify_repository.py
